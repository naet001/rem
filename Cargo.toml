[package]
name = "rem"
version = "0.1.4"
edition = "2024"

[dependencies]
rig = "0.42"
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "net"] }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
pulldown-cmark = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
html-escape = "0.2"
toml = "0.8"
dirs = "7.0"
rusqlite = { version = "0.32", features = ["bundled"] }
rmcp = { version = "2", features = ["client", "auth", "transport-child-process", "transport-streamable-http-client-reqwest"] }
oauth2 = "5"
reqwest013 = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
process-wrap = "9"
http = "1"

[dev-dependencies]
rmcp = { version = "2", features = ["client", "server", "auth", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
